# Local Development Profile
# ============================
# Activate with: spring.profiles.active=local
# Provides mock OTP for development testing

# Mock OTP Configuration (6 digits only)
etf.otp.mock-enabled=true
server.address=127.0.0.1

# OTP HMAC Key (development only - use strong random key in production)
etf.otp.development-key=${ETF_DEV_OTP_KEY:}

# Session Expiry (30 days = 720 hours)
ETF_SESSION_EXPIRY_HOURS=720

# Dedicated synthetic-only database supplied through the environment
spring.datasource.url=${ETF_DEVICE_DB_URL:}
spring.datasource.username=${ETF_DEVICE_DB_USERNAME:}
spring.datasource.password=${ETF_DEVICE_DB_PASSWORD:}

# Do not auto-create/alter the real schema locally without approval.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
