# Local Development Profile
# ============================
# Activate with: spring.profiles.active=local
# Provides mock OTP for development testing

# Mock OTP Configuration (6 digits only)
etf.otp.mock-enabled=true
ETF_OTP_MOCK_CODE=123456

# OTP HMAC Key (development only - use strong random key in production)
ETF_OTP_KEY=dev-otp-hmac-key-change-in-production

# Session Expiry (30 days = 720 hours)
ETF_SESSION_EXPIRY_HOURS=720

# Database (uses local defaults)
DB_URL=jdbc:postgresql://localhost:5432/ETF-login%28sap%29
DB_USERNAME=etf_loans_app
DB_PASSWORD=

# Do not auto-create/alter the real schema locally without approval.
flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true