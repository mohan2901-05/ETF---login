# Spring Boot Application Configuration
# ============================
# NOTE: Do not store actual credentials in this file.
# Use environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, ETF_OTP_KEY, ETF_SESSION_EXPIRY_HOURS

# Application
spring.application.name = etf-loans-backend

# Database configuration from environment variables
spring.datasource.url = ${DB_URL:jdbc:postgresql://localhost:5432/ETF-login%28sap%29}
spring.datasource.username = ${DB_USERNAME:etf_loans_app}
spring.datasource.password = ${DB_PASSWORD:}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql = true

# Flyway configuration
# Use the application datasource unless a migration datasource is explicitly supplied.
# Borrower V3 is in db/borrower-local for explicit migration of isolated databases.
spring.flyway.enabled = true
spring.flyway.baseline-on-migrate = false
spring.flyway.locations = classpath:db/migration

# OTP Configuration
etf.otp.expiry-minutes = 5
etf.otp.max-attempts = 5
etf.otp.resend-cooldown-seconds = 30
# Mock OTP mode (development only). When true, the send response includes
# developmentOtp so the flow works without an SMS provider. Never enable in production.
etf.otp.mock-enabled = ${ETF_OTP_MOCK_ENABLED:false}

# Rate limiting (per mobile number, sliding window). Single-instance only.
etf.otp.send-limit = ${ETF_OTP_SEND_LIMIT:3}
etf.otp.send-window-seconds = 900
etf.otp.verify-limit = ${ETF_OTP_VERIFY_LIMIT:10}
etf.otp.verify-window-seconds = 900

# Session Configuration
etf.session.expiry-hours = 720

# PAN fixture requires explicit opt-in and an isolated local or test profile.
etf.pan.synthetic-enabled = ${ETF_PAN_SYNTHETIC_ENABLED:false}

# Eligibility fixtures are opt-in and restricted to the isolated local/test profiles.
etf.eligibility.synthetic-enabled = ${ETF_ELIGIBILITY_SYNTHETIC_ENABLED:false}
etf.eligibility.synthetic-scenario = ${ETF_ELIGIBILITY_SYNTHETIC_SCENARIO:failure}

# Demo Mode (restricted demonstration only)
# When enabled, protects OTP endpoints with API key validation.
# Vercel serverless function holds etf.demo.api-key and forwards requests to Render.
# Android APK uses etf.demo.android-api-key for direct access.
# NO client-side secrets. Keys configured only in Vercel/Render environment variables.
etf.demo.enabled = ${ETF_DEMO_ENABLED:false}
etf.demo.api-key = ${ETF_DEMO_API_KEY:}
etf.demo.android-api-key = ${ETF_DEMO_ANDROID_API_KEY:}

# Server (Render/Fly inject PORT)
server.port = ${PORT:8080}

# CORS Configuration (consumed by CorsConfig; comma-separated origins, NO DEFAULT - must be set)
app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.com.etfloans = DEBUG
logging.level.org.springframework.security = DEBUG
