# Test profile: in-memory H2, no Flyway, schema created from entities.
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Deterministic mock OTP for tests
etf.otp.mock-enabled=true
ETF_OTP_MOCK_CODE=123456
etf.otp.development-key=test-otp-hmac-key-for-testing-32chars-minimum

# Demo mode for tests (allows devOtp in responses)
etf.demo.enabled=true
etf.demo.api-key=test-demo-api-key
etf.demo.android-api-key=test-android-api-key

# CORS for tests
CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080

# Rate limits used by tests
etf.otp.send-limit=3
etf.otp.verify-limit=10
