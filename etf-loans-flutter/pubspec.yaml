name: etf_loans
description: ETF Loans mobile login application
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.0.0
  # Networking
  http: ^1.1.0
  # JSON serialization
  json_annotation: ^4.8.1
  # Date/time utilities
  intl: ^0.18.0
  # Extension cords
  flutter_svg: ^2.0.7
  # Secure storage
  flutter_secure_storage: ^9.0.0
  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/logos/
  - assets/illustrations/